#btns button{width:var(--ab);height:var(--ab);border-radius:50%;border:3px solid #6a3040;background:#a83850;color:#fff;font:bold 20px ui-monospace,monospace;box-shadow:0 4px 0 #5a1c2c;padding:0}

};

try { if (!Store.get('mc_settings') && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) Settings.anim = 0; } catch (e) { }

  '8': '.###./#...#/#...#/.###./#...#/#...#/.###.', '9': '.###./#...#/#...#/.####/....#/...#./.##..',
  '.': '../../../../../##/##', ',': '../../../../.#/.#/#.', '!': '#/#/#/#/#/./#', '?': '.###./#...#/....#/...#./..#../...../..#..',
  '¿': '..#../...../..#../.#.../#..../#...#/.###.', '¡': '#/./#/#/#/#/#', ':': '../../##/##/../##/##',
  ';': '../../##/##/../.#/.#/#.', '-': '.../.../.../.../###/.../...', '+': '...../...../..#../..#../#####/..#../..#..',
  '=': '...../...../...../#####/...../#####/.....', '/': '....#/....#/...#./..#../.#.../#..../#....',
  '(': '.#/#./#./#./#./#./.#', ')': '#./.#/.#/.#/.#/.#/#.', "'": '#/#', '"': '#.#/#.#',

const FONT_ACC = {
  'á': ['a', 'acute'], 'é': ['e', 'acute'], 'í': ['ı', 'acute'], 'ó': ['o', 'acute'], 'ú': ['u', 'acute'], 'ü': ['u', 'diaer'], 'ñ': ['n', 'tilde'],
  'Á': ['A', 'cacute'], 'É': ['E', 'cacute'], 'Í': ['I', 'cacute'], 'Ó': ['O', 'cacute'], 'Ú': ['U', 'cacute'], 'Ñ': ['N', 'ctilde'], 'Ü': ['U', 'cdiaer']
};
const ACC_OVER = { acute: ['...#.', '..#..'], diaer: ['.#.#.', '.....'], tilde: ['.##.#', '#..#.'] };
const ACC_CAP = { cacute: '...#.', cdiaer: '.#.#.', ctilde: '.##.#' };
const Font = {
  glyphs: {}, cache: new Map(), LH: 10,
  init() {
    const build = (rows, top) => {
      let min = 99, max = -1;
      for (const r of rows) for (let i = 0; i < r.length; i++) if (r[i] === '#') { if (i < min) min = i; if (i > max) max = i; }
      if (top) for (let i = 0; i < top.length; i++) if (top[i] === '#') { if (i < min) min = i; if (i > max) max = i; }
      if (max < 0) { min = 0; max = 1; }
      return { rows, top, min, w: max - min + 1 };
    };
    for (const ch in FONT_SRC) this.glyphs[ch] = build(FONT_SRC[ch].split('/'));
    for (const ch in FONT_ACC) {
      const [base, acc] = FONT_ACC[ch];
      const b = FONT_SRC[base].split('/').slice();
      if (ACC_OVER[acc]) { const o = ACC_OVER[acc]; for (let r = 0; r < o.length; r++) { const row = b[r].split(''); for (let i = 0; i < 5; i++) if (o[r][i] === '#') row[i] = '#'; b[r] = row.join(''); } this.glyphs[ch] = build(b); }
      else this.glyphs[ch] = build(b, ACC_CAP[acc]);
    }
    this.glyphs[' '] = { rows: [], min: 0, w: 2 };
  },
  glyph(ch) { return this.glyphs[ch] || this.glyphs['?']; },
  adv(ch) { return this.glyph(ch).w + 1; },
  width(t) { let w = 0; for (const ch of String(t)) w += this.adv(ch); return Math.max(0, w - 1); },
  canvasFor(ch, color) {

  const bg = o.bg || C.bg, bd = o.bd || C.bd, b2 = o.b2 || C.bd2;
  g.fillStyle = bd; g.fillRect(x + 1, y, w - 2, h); g.fillRect(x, y + 1, w, h - 2);

function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function bar(g, x, y, w, ratio, col, h = 3) {
  rect(g, x - 1, y - 1, w + 2, h + 2, '#303848'); rect(g, x, y, w, h, '#d8d8d0');
  const fw = Math.round(w * clamp(ratio, 0, 1)); if (fw > 0) { rect(g, x, y, fw, h, col); rect(g, x, y, fw, 1, 'rgba(255,255,255,.35)'); }
}
function hpColor(r) { return r > 0.5 ? C.hp1 : r > 0.2 ? C.hp2 : C.hp3; }
function text(g, t, x, y, col = C.ink, sh = null) { return Font.draw(g, t, x, y, col, sh); }
function textR(g, t, x, y, col = C.ink, sh = null) { return Font.draw(g, t, x - Font.width(t), y, col, sh); }
function textC(g, t, cx, y, col = C.ink, sh = null) { return Font.draw(g, t, Math.round(cx - Font.width(t) / 2), y, col, sh); }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }

  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; } else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
}
function hsl(h, s, l) { return `hsl(${Math.round(h)},${Math.round(s)}%,${Math.round(l)}%)`; }

  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');

/* --- movimientos aprendidos por nivel (deterministas) --- */
const LEARN = {};
function genLearn(sp) {
  const r = mulberry32(sp.id * 7919 + 3), L = [], T = TMOVES;
  const add = (lv, id) => { if (id == null) return; if (!L.some(x => x[1] === id)) L.push([lv, id]); };
  const phys = sp.role === 'a' || sp.role === 'f' || sp.role === 'd' || (sp.role === 'b' && r() < .5) || (sp.role === 't' && r() < .5);
  const t1 = sp.t[0], t2 = sp.t[1], A = T[t1];
  const pa = phys ? A.t2f : A.t2e, pb = phys ? A.t2e : A.t2f, ca = phys ? A.t3f : A.t3e, cb = phys ? A.t3e : A.t3f;
  add(1, MV(r() < .5 ? 'Embestida' : 'Arañazo')); add(1, A.t1);
  add(3, MV(Rnd.fn === null ? 'Gruñido' : ['Gruñido', 'Malicioso', 'Endurecer', 'Afilar'][Math.floor(r() * 4)]));
  add(6, A.st); add(11, pa); add(17, r() < .5 ? pb : MV('Doble Golpe')); add(22, MV(['Golpe Cuerpo', 'Respiro', 'Impulso'][Math.floor(r() * 3)]));
  add(26, ca); add(32, cb); add(36, MV(['Guardia', 'Danza Espada', 'Mirada Fija', 'Rugido Tenue'][Math.floor(r() * 4)])); add(42, A.t4);
  if (sp.stageKey === 3 || sp.stageKey === 'L' || sp.stageKey === 0) add(50, MV('Hiperrayo'));
  if (t2) { const B = T[t2], pp = phys ? B.t2f : B.t2e, cc = phys ? B.t3f : B.t3e; add(8, B.t1); add(14, B.st); add(21, pp); add(34, cc); add(46, B.t4); }
  L.sort((a, b) => a[0] - b[0]); return L;
}
SPECIES.forEach(s => LEARN[s.id] = genLearn(s));
function movesAt(spId, lv) { const l = LEARN[spId].filter(x => x[0] <= lv).map(x => x[1]); return l.slice(-4); }

function calcStats(sp, lv) {
  const b = sp.base, f = (v) => Math.floor(2 * v * lv / 100) + 5;
  return { hp: Math.floor(2 * b.hp * lv / 100) + lv + 10, atk: f(b.atk), def: f(b.def), esp: f(b.esp), res: f(b.res), vel: f(b.vel) };
}

const INK = '#1c1c2c';
const R_ = (g, c, x, y, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
function noiseDots(g, seed, cols, n, x0 = 0, y0 = 0, w = 16, h = 16) { const r = mulberry32(seed); for (let i = 0; i < n; i++) R_(g, cols[Math.floor(r() * cols.length)], x0 + Math.floor(r() * w), y0 + Math.floor(r() * h), 1, 1); }
function disc(g, cx, cy, r, c) { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * .6) R_(g, c, cx + x, cy + y, 1, 1); }

const TL = {};
const Tiles = {
  defs: [], cache: new Map(), byName: TL,
  get(id, v, f, extra) {
    const k = id + '|' + v + '|' + f + '|' + (extra || 0); let c = this.cache.get(k);
    if (!c) { const [cv, g] = mkCanvas(16, 16); const d = this.defs[id]; d.draw(g, v, f, extra || 0); c = cv; this.cache.set(k, c); }
    return c;
  },
  draw(g, id, px, py, tx, ty, time, map) {
    const d = this.defs[id]; if (!d) return;
    const h = ((tx * 73856093) ^ (ty * 19349663)) >>> 0;
    const v = d.vars > 1 ? h % d.vars : 0, f = d.frames > 1 ? Math.floor(time / (d.speed || 420)) % d.frames : 0;
    let extra = 0;
    if (d.waterlike && d.shore && map) { const w = (x, y) => { const t = map.at(x, y); return t < 0 || (this.defs[t] && this.defs[t].waterlike); }; extra = (w(tx, ty - 1) ? 0 : 1) | (w(tx + 1, ty) ? 0 : 2) | (w(tx, ty + 1) ? 0 : 4) | (w(tx - 1, ty) ? 0 : 8); }
    g.drawImage(this.get(id, v, f, extra), px, py);
  }
};
function tdef(name, o, draw) { const id = Tiles.defs.length; Tiles.defs.push(Object.assign({ name, id, vars: 1, frames: 1, solid: false, draw }, o)); TL[name] = id; return id; }

function grassBase(g, v) { R_(g, GR.a, 0, 0, 16, 16); noiseDots(g, 100 + v, [GR.b, GR.b, GR.c], 9); const r = mulberry32(7 + v * 31); for (let i = 0; i < 3; i++) { const x = 1 + Math.floor(r() * 13), y = 1 + Math.floor(r() * 12); R_(g, GR.b, x, y, 1, 2); R_(g, GR.c, x + 1, y, 1, 1); } }

  grassBase(g, 1);
  const c1 = dark ? '#1f5a30' : '#2c8a3c', c2 = dark ? '#2c7440' : '#40a850', c3 = dark ? '#3c8c50' : '#6cd070';
  R_(g, '#6a4020', 6, 11, 4, 5); R_(g, '#8a5a30', 6, 11, 2, 5);

  noiseDots(g, 5, [c1, c3], 6, 3, 3, 10, 9);

function townBuildings(b, list) {

const TOWN_THEME = { alba: ['crate', 'hay', 'barrel'], verdeluz: ['barrel', 'crate'], roquedal: ['crate', 'barrel', 'crate'], dinamo: ['pylon'], escarcha: ['snowman', 'barrel'], brasaluz: ['brazier', 'barrel'], umbra: ['lantern_p'], ciudad_nebula: ['banner'] };
function themeTowns() {
  for (const id in TOWN_THEME) {
    const m = MAPS[id]; if (!m) continue; const r = mulberry32(hashStr(id + 'deco')), kinds = TOWN_THEME[id], placed = [], max = id === 'alba' ? 7 : 9;
    const nm = (x, y) => { const t = Tiles.defs[m.at(x, y)]; return t ? t.name : ''; };
    const free = (x, y) => { const d = Tiles.defs[m.at(x, y)]; return d && !d.solid && !d.water && !d.waterlike && !d.door && !d.cut && !d.smash; };
    const close = (obj, x, y, rad) => { for (const k in obj) { const [a, b] = k.split(',').map(Number); if (Math.abs(a - x) <= rad && Math.abs(b - y) <= rad) return true; } return false; };
    for (let tries = 0; tries < 900 && placed.length < max; tries++) {
      const x = 3 + Math.floor(r() * (m.w - 6)), y = 3 + Math.floor(r() * (m.h - 6)), n = nm(x, y);
      const bk = n === 'grass' ? 'g' : n === 'snow' ? 's' : n === 'dgrass' ? 'd' : n === 'volcfloor' ? 'v' : null; if (!bk) continue;
      let ok = true, road = false;
      for (let j = -1; j <= 1 && ok; j++) for (let i = -1; i <= 1; i++) { if (!free(x + i, y + j)) { ok = false; break; } const q = nm(x + i, y + j); if ((i === 0 || j === 0) && (q === 'path' || q === 'stone' || q === 'leaf_path')) road = true; }
      if (!ok || !road) continue;
      if (close(m.warps, x, y, 3) || close(m.talk, x, y, 2) || m.ents.some(e => Math.abs(e.x - x) <= 2 && Math.abs(e.y - y) <= 2)) continue;
      if (placed.some(p => Math.abs(p[0] - x) + Math.abs(p[1] - y) < 5)) continue;
      const kind = kinds[placed.length % kinds.length]; m.set(x, y, kind + '_' + bk); placed.push([x, y]);
    }
  }
}
// tocones y estalagmitas en rutas/cuevas: solo en claros de 5x5 libres, lejos de puertas, NPC y carteles
function themeRoutes() {
  for (const id in MAPS) {
    const m = MAPS[id]; if (m.indoor || !(m.kind === 'route' || m.cave)) continue;
    const r = mulberry32(hashStr(id + 'prop')), max = m.cave ? 8 : 6; let n = 0;
    const nm = (x, y) => { const t = Tiles.defs[m.at(x, y)]; return t ? t.name : ''; };
    const free = (x, y) => { const d = Tiles.defs[m.at(x, y)]; return d && !d.solid && !d.waterlike && !d.door && !d.cut && !d.smash && !d.ledge; };
    const close = (obj, x, y, rad) => { for (const k in obj) { const [a, b] = k.split(',').map(Number); if (Math.abs(a - x) <= rad && Math.abs(b - y) <= rad) return true; } return false; };
    const placed = [];
    for (let tries = 0; tries < 1200 && n < max; tries++) {
      const x = 3 + Math.floor(r() * (m.w - 6)), y = 3 + Math.floor(r() * (m.h - 6)), t = nm(x, y);
      const kind = t === 'grass' || t === 'dgrass' ? 'stump_' + (t === 'grass' ? 'g' : 'd') : t === 'cavefloor' ? 'stalag_c' : null; if (!kind) continue;
      let ok = true; for (let j = -2; j <= 2 && ok; j++) for (let i = -2; i <= 2; i++) if (!free(x + i, y + j)) { ok = false; break; }
      if (!ok || close(m.warps, x, y, 3) || close(m.talk, x, y, 3) || m.ents.some(e => Math.abs(e.x - x) <= 3 && Math.abs(e.y - y) <= 3)) continue;
      if (placed.some(p => Math.abs(p[0] - x) + Math.abs(p[1] - y) < 6)) continue;

}

/* ---------- utilidades de escena ---------- */
function spawnNpc(ow, id, lk, x, y, dir) { const e = { k: 'npc', id, x, y, hx: x, hy: y, d: dir || 'down', dir: dir || 'down', sp: look(lk), px: x * TS, py: y * TS, mv: null, wt: 1e9, fixed: true }; ow.rt.push(e); return e; }
function despawn(ow, e) { const i = ow.rt.indexOf(e); if (i >= 0) ow.rt.splice(i, 1); }
function freeAround(ow, dist, prefer) {
  const p = ow.p, ds = prefer ? [prefer, 'up', 'down', 'left', 'right'] : ['up', 'left', 'right', 'down'];
  for (const d of ds) { for (let k = dist; k >= 1; k--) { let ok = true; for (let i = 1; i <= k; i++) { const x = p.x + DIRV[d][0] * i, y = p.y + DIRV[d][1] * i, w = ow.walkable(x, y, d, p); if (!w.ok) { ok = false; break; } } if (ok) return { d, k }; } }
  return null;
}
// Entra un personaje caminando hacia el jugador. Devuelve ent
async function npcApproach(ow, id, lk, dist = 4) {
  const f = freeAround(ow, dist) || { d: 'up', k: 0 }; const p = ow.p, [dx, dy] = DIRV[f.d];
  const e = spawnNpc(ow, id, lk, p.x + dx * f.k, p.y + dy * f.k, OPP[f.d]); const steps = Math.max(0, f.k - 1);
  if (steps) await ow.walkEnt(e, Array(steps).fill(OPP[f.d]), 160); ow.facePlayerTo(e); p.dir = OPP[e.dir] ? (() => { const ddx = e.x - p.x, ddy = e.y - p.y; return Math.abs(ddx) > Math.abs(ddy) ? (ddx > 0 ? 'right' : 'left') : (ddy > 0 ? 'down' : 'up'); })() : p.dir; return e;
}
async function npcLeave(ow, e, dir, n = 4) { await ow.walkEnt(e, Array(n).fill(dir), 150); despawn(ow, e); }
async function say(t, who) { return UI.say(t, who ? { speaker: who } : undefined); }

    [[R[2], 58], ['Aquilor', 55], ['Thundrix', 55], ['Lunowolf', 56], ['Cliffhorn', 56], ['Dracopter', 57]]
  ][stage - 1];
}
async function rivalFight(ow, stage, lines, friendly) {
  const t = { id: 'rival' + stage, name: rivalName(), cls: 'Rival', look: 'rival', team: rivalTeam(stage), intro: lines.intro, win: lines.win, lose: lines.lose, money: 120 * stage + 60, friendly: !!friendly, noShift: true };

}

    b.ent({ k: 'block', id: m.id + '_gl' + x + '_' + y, x, y, need, msg });
  }
}

SCRIPTS.torneo = async function (e, ow) {
  ow.facePlayerTo(e);
  if (!flag('champion')) { await say(['Soy el organizador del Gran Torneo Nébula. Solo compiten los campeones de la Liga.', 'Vuelve cuando hayas derrotado a Zafira.']); return; }
  const first = !flag('torneo_won');
  if (!await UI.confirm('¿Quieres participar en el Gran Torneo? Son cuatro combates seguidos.' + (first ? ' ¡Gran premio al ganador!' : ''))) { await say(['Cuando quieras.']); return; }
  const rounds = [
    { id: 'tor1', name: 'Hiedra', cls: 'Líder', look: 'leader_g', team: [['Junglor', 64], ['Solbloom', 64], ['Elkaris', 65], ['Monkarch', 65], ['Sporlord', 64]] },
    { id: 'tor2', name: 'Volta', cls: 'Líder', look: 'leader_e', team: [['Thundrix', 65], ['Stormlynx', 66], ['Luminox', 65], ['Terraclaw', 65], ['Gnawdon', 64]] },
    { id: 'tor3', name: 'Gélida', cls: 'Líder', look: 'leader_i', team: [['Frostide', 66], ['Glacirox', 66], ['Auroriel', 66], ['Swanelle', 66], ['Blizzfang', 65]] },
    { id: 'tor4', name: 'Aurelia', cls: 'Líder', look: 'leader_p', team: [['Oraclon', 68], ['Constello', 69], ['Aquilor', 68], ['Hippomar', 68], ['Prismor', 68], ['Dracopter', 68]] }
  ];
  await say(['¡Que comience el Gran Torneo!'], 'Organizador');
  for (let i = 0; i < rounds.length; i++) {
    const R = rounds[i]; await say(['Ronda ' + (i + 1) + ' de 4: ' + R.name + '.'], 'Organizador');
    const t = Object.assign({ money: R.team[R.team.length - 1][1] * 80, music: 'league', noShift: true, friendly: true, intro: ['¡Que gane el mejor!'], win: ['Bien jugado.'], lose: ['Mejor suerte la próxima.'] }, R);
    delete TRAINERS[t.id]; const r = await fightTrainer(ow, t, { friendly: true });
    if (r.result !== 'win') { await say(['Has caído en la ronda ' + (i + 1) + '. ¡Puedes volver a intentarlo!'], 'Organizador'); return; }
    if (i < 3) { healParty(); await say(['Tus criaturas se han recuperado para la siguiente ronda.'], 'Organizador'); }
  }
  Aud.jingle('fanfare');
  if (first) { setFlag('torneo_won'); endQuest('torneo'); await say(['¡Campeón del Gran Torneo Nébula! Este es tu premio.'], 'Organizador'); await UI.getItem('esfera_max', 3); await UI.getItem('caramelo', 5); await UI.getItem('revivirmax', 3); }
  else { await say(['¡Otra victoria! Aquí tienes una recompensa.'], 'Organizador'); G.money += 5000; await UI.say('Recibiste $5000.'); }
  autoSave();
};

function buildWorld() {
  buildTowns();
  if (typeof buildRoutes1 === 'function') buildRoutes1(); if (typeof buildRoutes2 === 'function') buildRoutes2(); if (typeof buildRoutes3 === 'function') buildRoutes3(); if (typeof buildRoutes4 === 'function') buildRoutes4(); if (typeof buildExtras === 'function') buildExtras();
  applyLinks();
  if (typeof themeRoutes === 'function') themeRoutes();
  for (const id in MAPS) { const m = MAPS[id]; m.t0 = new Uint8Array(m.t); }
}
let WORLD_OK = false;
async function playGame(init) {
  const ow = new Overworld(); const done = Game.push(ow); Game.fade = 1; Game.fadeTarget = 1; Game.fadeColor = '#000';
  if (init.mode === 'new') {
    const slot = init.slot; newGameState('', 'm', slot); G.slot = slot;
    ow.p.x = 13; ow.p.y = 22; ow.loadMap('alba');
    ow.exec(() => SCRIPTS.newGameStart(ow));
  } else {
    if (typeof DEV !== 'undefined') DEV.onLoad(ow);
    G.surf = false; ow.loadMap(G.map); ow.p.x = G.x; ow.p.y = G.y; ow.p.dir = G.dir || 'down'; ow.p.px = G.x * TS; ow.p.py = G.y * TS; ow.lastAreaName = null; ow.showBanner(); Game.fadeIn(400);
  }
  return done;
}
async function main() {
  try { buildWorld(); WORLD_OK = true; } catch (e) { reportError(e); document.body.innerHTML = '<pre style="color:#fff;padding:12px">Error al construir el mundo: ' + (e && e.stack || e) + '</pre>'; return; }
  Game.start();
  for (;;) {
    Game.fade = 0; Game.fadeTarget = 0;
    const r = await Title.run();
    if (!r) continue;
    await Game.fadeOut(250); 
    await playGame(r);
    Aud.stop(); G = null;
  }
}
window.addEventListener('load', () => { initScreen(); main().catch(reportError); });
